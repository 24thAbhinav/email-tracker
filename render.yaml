services:
  - type: web
    name: job-tracker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/job_tracker.db
      - key: GMAIL_TOKEN_PATH
        value: /app/data/token.json
      - key: GMAIL_CREDENTIALS_PATH
        value: /app/data/credentials.json
      - key: GMAIL_PUBSUB_TOPIC
        sync: false
      - key: OPENCODE_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: job-tracker
